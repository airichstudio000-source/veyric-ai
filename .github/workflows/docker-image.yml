
name: VEYRIC AI - Docker Runtime Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Runtime Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build VEYRIC AI Docker image
        run: docker build --pull -t veyric-ai:runtime-test .

      - name: Verify Docker image
        run: docker image inspect veyric-ai:runtime-test

      - name: Start VEYRIC AI container
        run: |
          docker run -d \
            --name veyric-ai-runtime-test \
            -p 8080:8080 \
            -e PORT=8080 \
            veyric-ai:runtime-test

      - name: Test API Health Endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              echo "API Health Check: PASSED"
              exit 0
            fi
            echo "Waiting for VEYRIC AI server..."
            sleep 2
          done

          echo "API Health Check: FAILED"
          exit 1

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs veyric-ai-runtime-test || true
          docker rm -f veyric-ai-runtime-test || true
          
